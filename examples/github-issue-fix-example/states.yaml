# State machine diagram
# ---------------------
#
# Legend: [initial] [gating] [final]
#
#   issue-intake [initial]
#        |
#        | creates/reuses worktree, fetches issue, discovers repo rules,
#        | writes adequacy/spec-fit + routing artifacts, then writes
#        | exactly one follow-up task file starting in one of:
#        |
#        +--> implement-fix ----------------------+
#        |                                        |
#        +--> human-review [gating] --approve-----+
#        |        |                               |
#        |        +--handoff--> github-handoff    |
#        |        +--cancel----> cancelled        |
#        |
#        +--> github-handoff ---------------------+
#                                                 |
#                                                 v
#   completed [final] <--- publish-pr <--- review-dispatch [program] <--- aggregate-review <--- validation-review
#          ^                     ^                   |                         |                    ^
#          |                     |                   | ready too early         |                    |
#          |                     |                   v                         |                    |
#          |                     +------------- validate-fix                   |
#          |                                         ^                         |
#          |                                         |                         |
#          +--- record-blocked-publication <-- address-review <---------------+
#                                                not ready and attempts remain
#   implement-fix -> validate-fix -> requirements-review -> spec-review
#                                             -> implementation-review -> validation-review
#
# Review loop:
#   implement-fix -> validate-fix -> four focused reviews -> aggregate-review cycle 1
#   aggregate-review cycle 1 -> address-review -> validate-fix -> focused reviews -> aggregate-review cycle 2
#   aggregate-review -> review-dispatch checks `Ready to publish: yes/no`
#   review-dispatch -> publish-pr only when ready and required review passes are complete.
#                      In draft/no-pr mode, disclosed broad validation gaps do
#                      not block publication when focused validation passed.
#   review-dispatch -> validate-fix when ready but required review passes remain
#   review-dispatch -> address-review when not ready and repair attempts remain
#   review-dispatch -> record-blocked-publication when not ready and repair attempts are exhausted
#
# Per-task paths:
#   issue-intake: issue-intake -> completed
#   compatible follow-up: implement-fix -> validate-fix -> focused review cycle -> review-dispatch -> publish-pr -> completed
#   gated follow-up: human-review -> implement-fix OR github-handoff OR cancelled
#   blocked/unclear follow-up: github-handoff -> completed
#
# The intake task writes one top-level follow-up task under `tasks/`, not a
# child task, so the follow-up can depend on `Task issue-intake` without a
# parent/ancestor dependency.

name: github-issue-fix
version: 0.1.0

states:
  issue-intake:
    description: Prepare the issue worktree, fetch the issue, discover repo rules, analyze issue adequacy and spec fit, and write one routed follow-up task.
    initial: true
    target: "codex[yolo]:openai:gpt-5.5"
    instructions: |
      Intake GitHub issue `1234` in `vjovanov/rhei` for Task {task_id}: {task_title}.

      Treat this Rhei workspace as the scratchpad. Runtime artifacts and generated
      task files are written here. Code and documentation edits happen only in
      the issue worktree created from `/home/jovan/Work/rhei/.`.

      Step 1: create or reuse the issue worktree.
      - Resolve `/home/jovan/Work/rhei/.` to an absolute git checkout path.
      - Fetch `origin main` when possible.
      - Derive a filesystem-safe issue slug from `1234`.
      - Create or reuse a branch named `rhei/issue-<issue-slug>`.
      - Create or reuse a worktree under `runtime/worktrees/issue-<issue-slug>`.
      - Record the absolute worktree path, branch, base branch, work subdir, and
        checkout root in `{output.worktree-ref.path}`.

      Step 2: fetch the issue.
      - Use `gh issue view 1234 --repo vjovanov/rhei` or the equivalent URL form.
      - Include title, body, labels, author, assignees, state, comments, linked
        PRs, and any reproduction or acceptance evidence.
      - Write the durable snapshot to `{output.issue-snapshot.path}`.

      Step 3: discover repository instructions.
      - Read root `AGENTS.md` when present.
      - Read nested `AGENTS.md` files that apply to `.` and to
        any issue-mentioned paths.
      - Inspect `.agents/grund.toml` when present and determine whether `grund`
        is available.
      - Record relevant validation commands. Include the explicit configured
        commands when present: `[]`.
      - Write the result to `{output.repo-rules.path}`.

      Step 4: analyze issue adequacy and spec fit.
      - First decide whether the issue contains enough detail for an
        autonomous implementation. A fixable issue must identify a concrete
        failing or desired behavior, the affected component or enough evidence
        to locate it, the expected outcome, and a validation path. Refactor,
        cleanup, and design issues must also state the intended direction or
        acceptance criteria clearly enough that the workflow can name the
        likely change before editing code.
      - If the issue is too broad or vague to name the course of action, use
        verdict `underspecified`. If required facts, reproduction data, target
        component, or owner decision are missing, use verdict
        `insufficient-information`.
      - Compare the issue request with the repository instructions, goals,
        specs, non-goals, and decisions discovered from the checkout.
      - If `grund` is configured, use `grund list`, `grund <ID> --toc`, and
        `grund <ID> --full` as needed. Cite the most-specific relevant `§` IDs.
      - Do not edit specs or code in this state.
      - Write `{output.spec-fit.path}` with: issue request, adequacy check,
        missing details if any, relevant repo rules, relevant
        spec/goal/decision IDs, verdict, risks, whether spec/doc updates may be
        needed, and whether human review is required.
      - Use one verdict: `compatible`, `compatible-but-human-review-required`,
        `underspecified`, `conflicts-with-spec`, `insufficient-information`, or
        `external-owner-required`.

      Step 5: route and write exactly one follow-up task file under
      `$RHEI_ROOT/tasks/`.
      - Write `{output.routing.path}` with the selected start state and why.

      - If the verdict is `compatible`, create
        `$RHEI_ROOT/tasks/02-issue-work.md` with `**State:** human-review`
        because `require_human_spec_review` is true.

      - If the verdict is `compatible-but-human-review-required`, create
        `$RHEI_ROOT/tasks/02-issue-work.md` with `**State:** human-review`.
      - If the verdict is `underspecified`, `insufficient-information`,
        `conflicts-with-spec`, or `external-owner-required`, create
        `$RHEI_ROOT/tasks/02-issue-work.md` with `**State:** github-handoff`.
      - Do not create follow-up task files under `runtime/`; Rhei only
        discovers runnable task files from the workspace task directory.

      The generated task must have this shape:

        ### Task issue-work: Resolve issue <issue number or slug>
        **State:** <implement-fix | human-review | github-handoff>
        **Prior:** Task issue-intake

        - Repository: `vjovanov/rhei`
        - Issue: `1234`
        - Worktree: `{output.worktree-ref.path}`
        - Issue snapshot: `{output.issue-snapshot.path}`
        - Repository rules: `{output.repo-rules.path}`
        - Spec fit: `{output.spec-fit.path}`
        - Routing: `{output.routing.path}`
        - Publication mode: `no-pr`

      Finish only after all artifacts and the follow-up task file exist. The
      parent `rhei run` process advances the task to `completed`.
    outputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
        description: Worktree, branch, base branch, and work subdirectory for this issue.
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
        description: Durable GitHub issue snapshot.
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
        description: Applicable AGENTS.md, grund, validation, and contribution instructions.
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
        description: Spec compatibility analysis and routing verdict.
      - name: routing
        path: runtime/github-issue-fix/issue-intake/routing.md
        description: Selected follow-up start state and rationale.

  human-review:
    description: Human decides whether a spec-fit finding may proceed to implementation.
    gating: true
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: routing
        path: runtime/github-issue-fix/issue-intake/routing.md
    instructions: |
      Stop autonomous work on Task {task_id}: {task_title}.

      Review `{input.spec-fit.path}` and `{input.routing.path}`. If the issue
      may be implemented, transition this task to `implement-fix`. If it should
      only receive a GitHub response or needs an external owner, transition to
      `github-handoff`. If it should be abandoned, transition to `cancelled`.

  github-handoff:
    description: Prepare or publish a GitHub issue handoff when implementation should not proceed.
    target: "codex[yolo]:openai:gpt-5.5"
    inputs:
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: routing
        path: runtime/github-issue-fix/issue-intake/routing.md
    instructions: |
      Prepare the GitHub handoff for Task {task_id}: {task_title}.

      Read the issue snapshot, repo rules, spec-fit report, and routing note.
      Do not edit code.

      Publication mode is `no-pr`:
      - `no-pr`: do not perform any external GitHub writes. Do not post or
        update issue comments, push branches, or open/update PRs. Write a local
        draft handoff only, with `Posted URL: Not posted (publication_mode=no-pr)`.
      - `draft` or `ready`: draft a concise issue comment in `vjovanov/rhei`
        explaining why implementation is blocked, what evidence was checked,
        and what human information or decision is needed. If the verdict is
        `underspecified` or `insufficient-information`, ask targeted
        clarification questions for the missing details instead of proposing a
        speculative implementation. Avoid duplicate comments: if an equivalent
        recent handoff or clarification request already exists, record its URL
        instead of posting another one. Otherwise, post the comment and record
        the posted URL.

      Write `{output.github-handoff.path}` with the comment body, posted URL if
      posted, and any remaining human action.
    outputs:
      - name: github-handoff
        path: runtime/github-issue-fix/{task_id}/github-handoff.md
        description: GitHub handoff result or draft.

  implement-fix:
    description: Implement the issue fix in the isolated worktree.
    target: "codex[yolo]:openai:gpt-5.5"
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: routing
        path: runtime/github-issue-fix/issue-intake/routing.md
    instructions: |
      Implement the issue fix for Task {task_id}: {task_title}.

      Read all intake artifacts. Work only inside the worktree recorded in
      `{input.worktree-ref.path}`, under `.` unless the issue or
      repo rules require a broader path.

      Follow the applicable `AGENTS.md` instructions. If the target repo uses
      grund, preserve its citation rules. If the implementation needs spec or
      documentation updates, include them in this same change set and cite the
      most-specific relevant `§` IDs according to the target repo's rules.

      Apply the smallest fix that addresses the issue and stays consistent with
      the spec-fit analysis. Do not broaden the scope into unrelated cleanup.
      Do not push or open a PR in this state.

      Write `{output.implementation-note.path}` with files changed, rationale,
      spec/doc updates, tests added or changed, and known risks.
    outputs:
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        description: Summary of the implementation change.

  validate-fix:
    description: Run grund and repository validation for the issue fix.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: review-fix-note
        path: runtime/github-issue-fix/{task_id}/review-fix.md
        optional: true
    instructions: |
      Validate the issue fix for Task {task_id}: {task_title}.

      Work inside the recorded worktree. Focused validation is the default:
      run the smallest meaningful checks that directly exercise the changed
      behavior, plus cheap targeted hygiene checks from the target repo's
      `AGENTS.md` and repo-rules artifact. Prefer focused tests, affected
      module checks, targeted lint/style checks, targeted documentation/spec
      checks, and `git diff --check` over repository-wide suites.

      If `grund` is configured, run the narrowest applicable grounding check
      first. Run full `grund check` when it is cheap and compatible with the
      checkout/tooling; otherwise record the tooling/version blocker and run
      targeted citation/format checks where possible.

      Always run the explicit configured commands when present:
      `[]`.

      Do not run full repository builds, full functional suites, exact CI
      matrices, or documentation renders by default when they are expensive or
      unrelated to the focused issue behavior. Record them as validation gaps
      instead, with the narrower checks that were run. Run broad checks only
      when the change is broad, the repo rules make them mandatory for the
      touched area, the user supplied them via `validation_commands`, or no
      focused validation path exists.

      Do not hide failures. A failing focused check is a validation blocker.
      A skipped broad check is a disclosed gap, not a blocker by itself.

      Write `{output.validation-note.path}` and
      `{output.validation-note-visit.path}` with every command, working
      directory, exit result, important output summary, and remaining validation
      gaps. The stable file is the latest validation note; the visit file is a
      durable per-cycle record.
    outputs:
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
        description: Validation commands and results.
      - name: validation-note-visit
        path: runtime/github-issue-fix/{task_id}/validation-{visit_count}.md
        description: Per-cycle validation commands and results.

  requirements-review:
    description: Review whether the implementation satisfies the GitHub issue requirements.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
    instructions: |
      Review issue requirements for Task {task_id}: {task_title}.

      Inspect the current diff in the recorded worktree and the intake,
      implementation, and validation artifacts. Focus only on whether the
      implementation solves the issue that was actually reported:
      - requested behavior, bug, or acceptance criteria
      - reproduction evidence and expected outcome
      - affected component and user-facing behavior
      - missing issue details that make the implementation speculative
      - whether the change solves a different or narrower problem than the issue

      Write `{output.requirements-review.path}` with:
      - evidence checked
      - blocking findings, or `none`
      - non-blocking follow-ups, or `none`
      - `Requirements ready: yes` or `Requirements ready: no`

      Also write the same content to `{output.requirements-review-visit.path}`
      as the per-cycle review record.
    outputs:
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
        description: Requirements-focused review findings.
      - name: requirements-review-visit
        path: runtime/github-issue-fix/{task_id}/review-requirements-{visit_count}.md
        description: Per-cycle requirements-focused review findings.

  spec-review:
    description: Review goals, non-goals, grund citations, and spec compatibility.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
    instructions: |
      Review spec and repo-rule fit for Task {task_id}: {task_title}.

      Inspect the current diff in the recorded worktree and the intake,
      implementation, validation, and requirements-review artifacts. Focus only
      on whether the change fits the target repository's rules:
      - `AGENTS.md` instructions and nested repo guidance
      - goals, non-goals, decisions, and spec-fit verdict
      - grund declaration and citation requirements when configured
      - whether spec or documentation updates are required for the behavior
      - whether the change adds product surface outside the accepted scope

      Write `{output.spec-review.path}` with:
      - evidence checked
      - blocking findings, or `none`
      - non-blocking follow-ups, or `none`
      - `Spec ready: yes` or `Spec ready: no`

      Also write the same content to `{output.spec-review-visit.path}` as the
      per-cycle review record.
    outputs:
      - name: spec-review
        path: runtime/github-issue-fix/{task_id}/review-spec.md
        description: Spec, goals, non-goals, and grounding review findings.
      - name: spec-review-visit
        path: runtime/github-issue-fix/{task_id}/review-spec-{visit_count}.md
        description: Per-cycle spec, goals, non-goals, and grounding review findings.

  implementation-review:
    description: Review code quality, scope, maintainability, and edge cases.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
      - name: spec-review
        path: runtime/github-issue-fix/{task_id}/review-spec.md
    instructions: |
      Review implementation quality for Task {task_id}: {task_title}.

      Inspect the current diff in the recorded worktree and the intake,
      implementation, validation, requirements-review, and spec-review
      artifacts. Focus only on engineering quality:
      - local patterns and API boundaries
      - minimal scope and maintainability
      - error handling, edge cases, and compatibility risks
      - test placement and whether changed behavior is covered in code
      - whether unrelated cleanup or broad refactoring slipped in

      Write `{output.implementation-review.path}` with:
      - evidence checked
      - blocking findings, or `none`
      - non-blocking follow-ups, or `none`
      - `Implementation ready: yes` or `Implementation ready: no`

      Also write the same content to `{output.implementation-review-visit.path}`
      as the per-cycle review record.
    outputs:
      - name: implementation-review
        path: runtime/github-issue-fix/{task_id}/review-implementation.md
        description: Implementation-quality review findings.
      - name: implementation-review-visit
        path: runtime/github-issue-fix/{task_id}/review-implementation-{visit_count}.md
        description: Per-cycle implementation-quality review findings.

  validation-review:
    description: Review validation coverage, command choice, failures, and CI risk.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
      - name: spec-review
        path: runtime/github-issue-fix/{task_id}/review-spec.md
      - name: implementation-review
        path: runtime/github-issue-fix/{task_id}/review-implementation.md
    instructions: |
      Review validation readiness for Task {task_id}: {task_title}.

      Inspect the current diff in the recorded worktree and the intake,
      implementation, validation, requirements-review, spec-review, and
      implementation-review artifacts. Focus only on validation quality:
      - whether commands match the affected files and repo instructions
      - whether failures were fixed or explicitly remain blocking
      - whether skipped commands are justified with credible narrower checks
      - whether likely CI-only failures were considered
      - whether the PR body can honestly report validation evidence

      Write `{output.validation-review.path}` with:
      - evidence checked
      - blocking validation failures, or `none`
      - non-blocking follow-ups, or `none`
      - validation gaps to disclose, or `none`
      - `Validation blocking: yes` only when focused checks failed, required
        configured validation failed, changed code cannot be shown to compile
        in the affected area, or no credible focused validation path was run;
        otherwise `Validation blocking: no`
      - `Validation ready: yes` when no validation-blocking failure remains.
        Missing broad/full-suite validation may still be listed as a disclosure
        gap, especially for draft PRs.

      Also write the same content to `{output.validation-review-visit.path}` as
      the per-cycle review record.
    outputs:
      - name: validation-review
        path: runtime/github-issue-fix/{task_id}/review-validation.md
        description: Validation-focused review findings.
      - name: validation-review-visit
        path: runtime/github-issue-fix/{task_id}/review-validation-{visit_count}.md
        description: Per-cycle validation-focused review findings.

  aggregate-review:
    description: Combine focused reviews into one PR-readiness decision for this cycle.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 4
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: repo-rules
        path: runtime/github-issue-fix/issue-intake/repo-rules.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: implementation-note
        path: runtime/github-issue-fix/{task_id}/implementation.md
        optional: true
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
      - name: spec-review
        path: runtime/github-issue-fix/{task_id}/review-spec.md
      - name: implementation-review
        path: runtime/github-issue-fix/{task_id}/review-implementation.md
      - name: validation-review
        path: runtime/github-issue-fix/{task_id}/review-validation.md
    instructions: |
      Aggregate focused review cycle {visit_count} of {visits} for Task
      {task_id}: {task_title}.

      Publication needs at least 2 focused review cycle(s).
      If blockers are found after the required review cycle count, mark them
      clearly instead of treating publication as ready.

      Read the requirements, spec, implementation, and validation review
      artifacts. Do not introduce new broad review themes here; reconcile the
      focused findings into a single action list for the implementer.

      Readiness policy:
      - Requirements, spec/grund, and implementation blockers always block
        publication.
      - Validation failures in focused checks, explicitly configured
        validation commands, or affected-area compile/test checks block
        publication.
      - Missing full repository builds, full functional suites, exact CI
        matrices, or documentation renders are validation gaps to disclose, not
        blockers by themselves, when focused validation for the issue behavior
        passed or was credibly covered by a narrower check.
      - For `publication_mode=draft`, publishable means suitable for maintainer
        review with honest validation disclosure. Do not block a draft PR only
        because expensive broad validation was not run.
      - For `publication_mode=ready`, broad validation gaps may block when they
        are important enough that the PR should not be marked ready for review.
      - For `publication_mode=no-pr`, use the same readiness judgment, but the
        publication state records local-only output instead of pushing.

      Write `{output.review-summary.path}` with:
      - review cycle number
      - requirements blockers, or `none`
      - spec/grund blockers, or `none`
      - implementation blockers, or `none`
      - validation blockers, or `none`
      - validation gaps to disclose, or `none`
      - non-blocking follow-ups, or `none`
      - `Fixable blockers: yes` when the implementation agent can address the
        blockers in the issue worktree; otherwise `Fixable blockers: no`
      - `External blockers: yes` when the blocker needs unavailable
        credentials, missing external infrastructure, maintainer/product
        decisions, or user information; otherwise `External blockers: no`
      - `Ready to publish: yes` when requirements/spec/implementation are ready
        and no validation blocker remains under the readiness policy above;
        otherwise `Ready to publish: no`

      Also write the same content to `{output.review-summary-visit.path}` as the
      per-cycle aggregate record.
    outputs:
      - name: review-summary
        path: runtime/github-issue-fix/{task_id}/review-summary.md
        description: Aggregated focused-review findings and PR readiness.
      - name: review-summary-visit
        path: runtime/github-issue-fix/{task_id}/review-summary-{visit_count}.md
        description: Per-cycle aggregated focused-review findings and PR readiness.

  review-dispatch:
    description: Deterministically route the aggregate review verdict to publication, repair, or handoff.
    visits: 4
    program:
      command:
        - bash
        - -lc
        - |
          set -eu
          summary="runtime/github-issue-fix/{task_id}/review-summary.md"
          if grep -Eiq '^Ready to publish:[[:space:]]*yes[[:space:]]*$' "$summary"; then
            exit 0
          fi
          if grep -Eiq '^External blockers:[[:space:]]*yes[[:space:]]*$' "$summary"; then
            exit 2
          fi
          exit 1
    program_timeout: 30s
    inputs:
      - name: review-summary
        path: runtime/github-issue-fix/{task_id}/review-summary.md

  address-review:
    description: Address blocking findings from the latest focused review cycle.
    target: "codex[yolo]:openai:gpt-5.5"
    visits: 2
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: review-summary
        path: runtime/github-issue-fix/{task_id}/review-summary.md
      - name: requirements-review
        path: runtime/github-issue-fix/{task_id}/review-requirements.md
      - name: spec-review
        path: runtime/github-issue-fix/{task_id}/review-spec.md
      - name: implementation-review
        path: runtime/github-issue-fix/{task_id}/review-implementation.md
      - name: validation-review
        path: runtime/github-issue-fix/{task_id}/review-validation.md
    instructions: |
      Address review findings for Task {task_id}: {task_title}.

      Read `{input.review-summary.path}` and the four focused review artifacts.
      If the summary has no blocking findings, make no code changes and record
      a no-op. Otherwise, fix only the blocking findings inside the recorded
      worktree. Preserve the issue scope and do not broaden the PR.

      Write `{output.review-fix-note.path}` and
      `{output.review-fix-note-visit.path}` with findings addressed, files
      changed, and any validation that should be rerun. The stable file is the
      latest repair note; the visit file is a durable per-cycle record.
    outputs:
      - name: review-fix-note
        path: runtime/github-issue-fix/{task_id}/review-fix.md
        description: Summary of fixes applied after review.
      - name: review-fix-note-visit
        path: runtime/github-issue-fix/{task_id}/review-fix-{visit_count}.md
        description: Per-cycle summary of fixes applied after review.

  publish-pr:
    description: Push the reviewed branch and open or update the issue PR.
    target: "codex[yolo]:openai:gpt-5.5"
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: review-summary
        path: runtime/github-issue-fix/{task_id}/review-summary.md
    instructions: |
      Publish the issue fix for Task {task_id}: {task_title}.

      First inspect `{input.review-summary.path}`. If it has blocking findings
      or `Ready to publish: no`, do not publish. Write the publication note as
      blocked and leave the branch local. Do not override `Ready to publish:
      yes` merely because the summary lists validation gaps to disclose; those
      gaps belong in the PR body.

      Publication mode is `no-pr`:
      - `no-pr`: do not perform any external GitHub writes. Do not push, open
        or update a PR, apply labels, request reviewers, or post/update issue
        comments. Write the local branch and commit status only.
      - `draft`: push the branch and open or update a draft PR.
      - `ready`: push the branch and open or update a ready-for-review PR.


      Infer a writable fork remote because `pr_push_remote` was not supplied.


      Infer the PR head owner from the push remote because `pr_head_owner` was
      not supplied.

      Fail clearly in the publication artifact rather than pushing to an
      ambiguous remote.

      The PR body must include the issue link, spec-fit summary, implementation
      summary, validation evidence, validation gaps to disclose, review
      readiness, and any remaining human follow-up.
      - Include a GitHub closing keyword for the source issue when the PR is
        intended to fully resolve it: `Fixes #<issue-number>` for issues in
        `vjovanov/rhei`, or `Fixes <owner>/<repo>#<issue-number>` if the issue link
        needs the fully-qualified form. Put this in the PR body, not only in
        the title or commit message, so GitHub can auto-close the issue on
        merge.
      - If the PR is intentionally partial, exploratory, or only a docs/triage
        follow-up that should not close the issue, use `Refs #<issue-number>`
        instead and explain what remains.

      Resolve configured PR labels before applying them: `["rhei"]`.
      Check the target repository's existing labels with `gh label list` or the
      GitHub labels API. Apply only configured labels that already exist on the
      repository, including `rhei` when present. Do not create missing labels.
      For an existing PR, add any existing configured labels that are missing
      from the PR. Record missing configured labels as skipped.

      Write `{output.publication-note.path}` with PR URL or local-only status,
      branch, commit SHA, configured labels, applied labels, skipped labels,
      reviewers if any, and remaining human action.
    outputs:
      - name: publication-note
        path: runtime/github-issue-fix/{task_id}/publication.md
        description: PR publication or local-only result.

  record-blocked-publication:
    description: Record that review blockers prevented safe PR publication.
    target: "codex[yolo]:openai:gpt-5.5"
    inputs:
      - name: worktree-ref
        path: runtime/github-issue-fix/issue-intake/worktree.yaml
      - name: issue-snapshot
        path: runtime/github-issue-fix/issue-intake/issue.md
      - name: spec-fit
        path: runtime/github-issue-fix/issue-intake/spec-fit.md
      - name: validation-note
        path: runtime/github-issue-fix/{task_id}/validation.md
      - name: review-summary
        path: runtime/github-issue-fix/{task_id}/review-summary.md
    instructions: |
      Record blocked publication for Task {task_id}: {task_title}.

      The bounded review/fix loop is exhausted and `{input.review-summary.path}`
      still reports blockers or `Ready to publish: no`.
      Do not push, open or update a PR, apply labels, request reviewers, or post
      issue comments, regardless of publication mode. Leave the branch local.

      Write `{output.publication-note.path}` with local-only blocked status,
      branch, commit SHA when available, the remaining review blockers,
      validation evidence, and remaining human action.
    outputs:
      - name: publication-note
        path: runtime/github-issue-fix/{task_id}/publication.md
        description: Local-only result explaining why publication was blocked.

  completed:
    description: Issue workflow is complete.
    instructions: |
      Task {task_id} is complete.
    final: true

  cancelled:
    description: Issue workflow was cancelled.
    instructions: |
      Stop work on Task {task_id}. Leave worktree branches and runtime artifacts
      in place for inspection.
    final: true

transitions:
  - from: issue-intake
    to: completed
    description: Intake artifacts and routed follow-up task were written.

  - from: human-review
    to: implement-fix
    description: Human approved implementation.

  - from: human-review
    to: github-handoff
    description: Human selected GitHub handoff instead of implementation.

  - from: github-handoff
    to: completed
    description: GitHub handoff was recorded.

  - from: implement-fix
    to: validate-fix
    description: Implementation is ready for validation.

  - from: validate-fix
    to: requirements-review
    description: Validation results are ready for focused requirements review.

  - from: requirements-review
    to: spec-review
    description: Requirements review is ready for spec review.

  - from: spec-review
    to: implementation-review
    description: Spec review is ready for implementation review.

  - from: implementation-review
    to: validation-review
    description: Implementation review is ready for validation review.

  - from: validation-review
    to: aggregate-review
    description: Focused reviews are ready for aggregation.

  - from: aggregate-review
    to: review-dispatch
    description: Aggregate review summary is ready for deterministic routing.

  - from: review-dispatch
    to: publish-pr
    exit_code: 0
    condition: visitCount >= 2
    description: The aggregate review is ready and required focused review cycles are complete.

  - from: review-dispatch
    to: validate-fix
    exit_code: 0
    condition: visitCount < 2
    description: The aggregate review is ready, but required focused review cycles remain.

  - from: review-dispatch
    to: address-review
    exit_code: 1
    condition: visitCount <= 2
    description: The aggregate review is not ready and fix attempts remain.

  - from: review-dispatch
    to: record-blocked-publication
    exit_code: 1
    condition: visitCount > 2
    description: The aggregate review is not ready and fix attempts are exhausted; record blocked publication.

  - from: review-dispatch
    to: github-handoff
    exit_code: 2
    description: The aggregate review found an external or human-only blocker.

  - from: address-review
    to: validate-fix
    description: Review findings were addressed; validate again.

  - from: publish-pr
    to: completed
    description: Publication result was recorded.

  - from: record-blocked-publication
    to: completed
    description: Blocked publication result was recorded.

  - from: "*"
    to: cancelled
    description: Cancel any non-final task.
