name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Two jobs that run in parallel, so the wall clock is the slowest *test* job
# rather than the test job plus every repository gate stacked on top of it.
# Both stay inside this one workflow: the release helpers look the green run
# up by workflow name. §AR-ci-release.1
jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::all

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test
        if: matrix.os != 'windows-latest'
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      # Windows runs every test that needs no shell: the unit tests of every
      # crate, rhei-core's integration tests, and the CLI's integration target.
      # The CLI's *e2e* target drives `sh` mock agents throughout and is still
      # excluded there; porting it is #91.
      #
      # Three steps rather than three lines in one, so a failure in the first
      # still lets the rest run and one red job reports everything there is to
      # fix. `rhei-core` is the directory; `rhei-plan` is the package name cargo
      # answers to.
      # `rhei-api` is excluded rather than left to its manifest's `test = false`:
      # `--lib` selects targets explicitly, and an explicit selection overrides
      # that flag. Its N-API shims resolve against a host Node process, so the
      # empty harness aborts here.
      - name: cargo test (unit)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --lib --exclude rhei-api --locked --no-fail-fast

      - name: cargo test (rhei-core)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test -p rhei-plan --locked --no-fail-fast

      # The CLI's integration target: it spawns the built `rhei` and reads what
      # it wrote, which is exactly the path handling Windows spells differently.
      # The tests inside it that do stand a shell script up as an agent, a
      # polled program, or a callback are `#[cfg(unix)]` and say so (#91).
      - name: cargo test (CLI integration)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        timeout-minutes: 30
        run: cargo test -p rhei-cli --test integration_markdown_plans --locked --no-fail-fast

  lint:
    name: repository gates (grund, fissile, lychee, changelog, attribution)
    runs-on: ubuntu-latest
    env:
      GRUND_VERSION: 0.9.0
      LYCHEE_VERSION: 0.23.0
      FISSILE_VERSION: 0.7.0
      TOOLS_ROOT: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@v6

      - name: Install current stable Rust for tooling
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # The gate binaries are compiled from source on a cache miss only. They
      # live under their own root so the cache never touches rustup's proxies
      # in ~/.cargo/bin; the key is the pinned versions, so bumping one rebuilds.
      - name: Cache gate tool binaries
        id: tools-cache
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ env.TOOLS_ROOT }}
          key: ${{ runner.os }}-gate-tools-grund-${{ env.GRUND_VERSION }}-lychee-${{ env.LYCHEE_VERSION }}-fissile-${{ env.FISSILE_VERSION }}

      - name: Install gate tools
        shell: bash
        run: |
          set -euo pipefail
          install_tool() {
            local name="$1" version="$2"
            if [ -x "$TOOLS_ROOT/bin/$name" ]; then
              echo "$name $version: cached"
            else
              cargo +stable install "$name" --version "$version" --locked --root "$TOOLS_ROOT"
            fi
          }
          install_tool grund "$GRUND_VERSION"
          install_tool lychee "$LYCHEE_VERSION"
          install_tool fissile "$FISSILE_VERSION"
          echo "$TOOLS_ROOT/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet pre-commit

      - name: grund config validate
        run: grund config validate

      - name: grund check
        run: grund check .

      # The hook contract, minus the cargo hooks the test job already ran on
      # three platforms: running them here again would run the suite twice.
      - name: pre-commit (repository gates)
        env:
          SKIP: cargo-fmt-check,cargo-clippy,cargo-build,cargo-test
        run: pre-commit run --all-files --show-diff-on-failure

      - name: changelog PR entry
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog_pr_entry.py --pr-number "${{ github.event.pull_request.number }}"
