# Soft (agent-facing) file-size exception registry (fissile spec FS-003-exceptions).
#
# Entries here silence soft-limit warnings for files this repo has deliberately
# accepted as oversized, each with a written reason and a maximum accepted size
# so the warning returns if the file grows past it. Add entries with
# `fissile exception add --severity soft` (fissile spec FS-005-exception-add).
#
# `kind` says which claim the entry makes, and therefore what `reason` has to
# establish (fissile spec FS-003-exceptions.2.1):
#
#   structural  splitting this file is illegal — name the constraint and what
#               would break. Nothing retires it, so `until` is "indefinite".
#   deferred    no constraint; a boundary is missing — name it and what has to
#               exist first. `until` names the condition that retires the entry.
#
# Neither is answered by describing what the file contains.

fissile_exceptions_version = 2

[[exceptions]]
path = "crates/rhei-cli/src/cli/run_agent_mode.rs"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 3800, unit = "lines" }
until = "Split into scheduler, sequential execution, parallel execution, and result handling modules."
reason = """
Mechanical extraction from the former CLI monolith; still one orchestration loop.
"""
