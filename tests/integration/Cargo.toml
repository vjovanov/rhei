# The repository's `integration` home (grund.toml, FS-config.3.4.4) is also a
# workspace member, so the Rust tests in it are built and run by
# `cargo test --workspace` without a `[[test]] path` reaching out of a
# published crate — `cargo package` verifies a crate against its own tree, and
# a target outside it would not be there.
[package]
name = "rhei-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Integration tests: proof that the parts of rhei fit as designed."

# The tests are the files of this directory: it is the home, not a crate with
# a `tests/` subtree of its own.
autotests = false

[[test]]
name = "integration_markdown_plans"
path = "integration_markdown_plans.rs"

[dev-dependencies]
rhei-core = { package = "rhei-plan", path = "../../crates/rhei-core" }
rhei-cli = { path = "../../crates/rhei-cli" }
serde_json = "1"
serde_yaml = "0.9"
